<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <!-- Floating Chat Icon -->
    <div class="chat-icon" onclick="toggleChat()">
        💬
    </div>

    <!-- Chatbot Container -->
    <div class="chat-container" id="chat-container">
        <div class="chat-header">
            <span>Multiverz Brainstroming AI</span>
            <button onclick="toggleChat()">✖</button>
        </div>
        
        <div id="chat-box"></div>

        <div class="chat-footer">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div> AI is thinking...
        </div>
    </div>

    <script>
        function toggleChat() {
            let chatContainer = document.getElementById("chat-container");
            chatContainer.style.display = chatContainer.style.display === "none" ? "flex" : "none";
        }

        function formatAIResponse(text) {
            return text
                .replace(/### (.*?)\n/g, '<h3>$1</h3>')  // Convert ### headings to <h3>
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')  // Convert **bold** to <b>
                .replace(/(^|\n)(\d+)\. /g, '$1<b>$2.</b> ') // Bold only the number at the start
                .replace(/\*(.*?)\*:/g, '<b>$1:</b>')    // Bold phrases like *Core Problem:*
                .replace(/\n- /g, '<br>- ')              // Preserve bullet points
                .replace(/\n/g, '<br>');                 // Convert new lines to <br>
        }
        
        
        
        
        
        function sendMessage() {
            let userInput = document.getElementById("user-input").value.trim();
            if (!userInput) return;
        
            let chatBox = document.getElementById("chat-box");
            let loadingIndicator = document.getElementById("loading");
        
            // Add user message to chatbox
            let userMessage = `<div class='user-message'><strong>You:</strong> ${userInput}</div>`;
            chatBox.innerHTML += userMessage;
            document.getElementById("user-input").value = "";
        
            // Show loading animation
            loadingIndicator.style.display = "block";
        
            fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userInput }) // Ensure message is sent correctly
            })
            .then(response => response.json())
            .then(data => {
                let formattedResponse = formatAIResponse(data.ai_response || "I couldn't understand that.");
                let aiMessage = `<div class='ai-message'><strong>🤖 AI:</strong> ${formattedResponse}</div>`;
                chatBox.innerHTML += aiMessage;
        
                // Hide loading animation
                loadingIndicator.style.display = "none";
        
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                console.error("Error:", error);
                loadingIndicator.style.display = "none"; // Hide loading on error
            });
        }
        
    </script>

</body>
</html>
